name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # The committed Kotlin must be exactly what the generator produces from the IDLs.
      - name: Regenerate clients and reference vectors
        run: |
          npm run generate
          npm run generate:squads
          npm run vectors

      - name: Generated code is up to date
        run: git diff --exit-code

      - name: Byte-for-byte tests against the official JS client
        working-directory: kotlin-demo
        run: ./gradlew test

  android-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The Seeker demo compiles the same generated sources as kotlin-demo.
      - name: Build the Android demo
        working-directory: android-demo
        run: ./gradlew assembleDebug
